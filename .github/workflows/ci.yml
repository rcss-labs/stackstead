# Pull request and main-branch verification: every test suite the repository has. The Makefile
# stays the local entry point; each job names the target or command it mirrors.
#
# Security posture: the workflow uses `pull_request` (never `pull_request_target`), so code from
# forks runs without secrets and with a read-only token; no job uses any secret. Every third-party
# action is pinned to a full commit SHA (the tag is in the trailing comment).
#
# Branch protection requires the `all-checks` job only. It fails unless every other job passed, so
# adding or renaming a job here never needs a settings change.
#
# The release workflow (release.yml) calls this file through `workflow_call`, so a release is built
# only from a commit that passes the same suites.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# An explicit `shell: bash` is what turns on pipefail; without it `cmd | tee log` reports tee's
# status and a failing test run passes.
defaults:
  run:
    shell: bash

concurrency:
  # workflow_call runs share the caller's ref; the distinct prefix keeps a release from cancelling
  # (or being cancelled by) the main-branch run of the same commit.
  group: ci-${{ github.event_name == 'workflow_dispatch' && 'release' || github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The UI half of make check: type-check, build and tests. Runs beside `go` (which rebuilds the
  # UI it embeds but skips the UI tests) so the two longest suites overlap.
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web dependencies
        run: npm ci
        working-directory: web

      - name: Web type-check, build and tests
        run: |
          npm run check
          npm run build
          npm run test
        working-directory: web

  # The Go half of make check + govulncheck: vet, gofmt and Go unit tests (race).
  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go-version-file reads the `go` line of go.mod, which is the patched compiler floor.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web dependencies
        run: npm ci
        working-directory: web

      # The Go tests embed web/dist, so the UI is built (not tested; `web` does that) before them.
      - name: Build the UI
        run: npm run build
        working-directory: web

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal tools web/*.go)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      # Verbose output is kept as an artifact when the run fails so an intermittent failure
      # names the test that failed (issue #64). pipefail (from `defaults.run.shell`) keeps go
      # test's exit status through tee.
      - name: go test
        run: go test -race -timeout 600s -v ./... 2>&1 | tee go-test.log

      - name: Upload go test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-log
          path: go-test.log
          retention-days: 14

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # go test -tags integration: the store, engine and stacks tests against the runner's Docker.
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Integration tests
        run: go test -tags integration -race -timeout 900s -v ./... 2>&1 | tee integration-test.log

      - name: Upload integration test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-log
          path: integration-test.log
          retention-days: 14

  # make e2e: the real binary driven over HTTP and as a CLI, with Docker for the throwaway stacks
  # and the runner's Chrome for the login render.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the UI
        run: make ui

      - name: End-to-end tests
        run: make e2e 2>&1 | tee e2e-test.log

      - name: Upload e2e test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-log
          path: e2e-test.log
          retention-days: 14

  # make installer-test, host half: go vet, the host tests of test/installer, deploy/ and tools/
  # (install.sh, packaging, shellcheck; everything that is not an *InContainer test), then the
  # same host tests again under dash. The container half runs in installer-linux-containers.
  installer-linux-host:
    name: installer-linux-host
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install shells for the script tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dash shellcheck

      - name: Installer host tests
        run: |
          go vet -tags installer ./...
          go test -tags installer -count=1 -parallel 4 -timeout 1800s -v -skip InContainer ./test/installer/ ./deploy/... ./tools/... 2>&1 | tee installer-test.log

      - name: Installer host tests under dash
        run: STACKSTEAD_TEST_SHELL=dash go test -tags installer -count=1 -timeout 1800s -v -skip InContainer ./test/installer/ 2>&1 | tee installer-dash-test.log

      - name: Upload installer test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-linux-host-log
          path: installer-*test.log
          retention-days: 14

  # make installer-test, container half: the *InContainer tests (Debian, Ubuntu, Rocky, Alpine
  # images, .deb/.rpm installs, package lint) split into shards by test name. Together with
  # installer-linux-host every test runs exactly once: the host job skips InContainer, shard 1 and
  # 2 select by regex, shard 3 is everything else (-skip of the other two). The regexes must stay
  # in step with the test names: verify with `go test -tags installer -list '.*' ./test/installer/`.
  installer-linux-containers:
    name: installer-linux-containers (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: upgrade
            run: '^Test(Upgrade.*|SameVersionIsNoop)InContainer$'
          - shard: packages
            run: '^Test(Deb|Rpm|Package|Reinstall|AdminStacksDir|InstallScriptRefusesOverRealPackage|SystemdSmoke).*InContainer$'
          - shard: script
            run: '^Test.*InContainer$'
            skip: '^Test((Upgrade.*|SameVersionIsNoop)|(Deb|Rpm|Package|Reinstall|AdminStacksDir|InstallScriptRefusesOverRealPackage|SystemdSmoke).*)InContainer$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Installer container tests
        env:
          RUN_REGEX: ${{ matrix.run }}
          SKIP_REGEX: ${{ matrix.skip }}
        run: |
          args=(-run "$RUN_REGEX")
          if [ -n "$SKIP_REGEX" ]; then args+=(-skip "$SKIP_REGEX"); fi
          go test -tags installer -count=1 -parallel 4 -timeout 1800s -v "${args[@]}" ./test/installer/ 2>&1 | tee installer-test.log

      - name: Upload installer test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-linux-containers-${{ matrix.shard }}-log
          path: installer-test.log
          retention-days: 14

  # The booted-systemd smoke: install.sh and the real .deb in a privileged container whose PID 1
  # is systemd (the runners are cgroup v2 hosts).
  systemd-smoke:
    name: systemd-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: systemd smoke
        env:
          STACKSTEAD_SYSTEMD_TEST: "1"
        run: go test -tags installer -count=1 -run SystemdSmoke -timeout 900s -v ./test/installer/ 2>&1 | tee systemd-test.log

      - name: Upload systemd test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: systemd-smoke-log
          path: systemd-test.log
          retention-days: 14

  # The macOS side of make installer-test: install.sh under the system sh and the .pkg structure
  # (pkgbuild, universal binary, scripts, ownership). Installing the .pkg needs sudo and stays manual.
  installer-macos:
    name: installer-macos
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Installer tests
        run: |
          go vet -tags installer ./...
          go test -tags installer -count=1 -timeout 1800s -v -skip InContainer ./test/installer/ ./deploy/... ./tools/... 2>&1 | tee installer-test.log

      - name: Upload installer test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-macos-log
          path: installer-test.log
          retention-days: 14

  all-checks:
    name: all-checks
    if: always()
    needs: [web, go, integration, e2e, installer-linux-host, installer-linux-containers, systemd-smoke, installer-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success")' >/dev/null
