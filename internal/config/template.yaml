# Stackstead configuration. Every key can be overridden with an environment
# variable: STACKSTEAD_<KEY in upper case>, e.g. STACKSTEAD_LISTEN.

# Address the web UI listens on. Keep it on localhost and put a reverse proxy
# with TLS in front if you need remote access — UI access is root on this host.
listen: {{.Listen}}

# Where stacks created by Stackstead live: <stacks_dir>/<name>/compose.yaml
stacks_dir: {{.StacksDir}}

# SQLite database and other state.
data_dir: {{.DataDir}}

# Directories the file browser may open (for picking Dockerfiles).
# Defaults to [stacks_dir]. Env form: comma-separated.
{{.AllowedRootsBlock}}

metrics_retention: {{.MetricsRetention}}
metrics_interval: {{.MetricsInterval}}
operation_timeout: {{.OperationTimeout}}
image_operation_timeout: {{.ImageOperationTimeout}}

# Terminal access into containers. A terminal is root-equivalent on that container.
exec_enabled: {{.ExecEnabled}}
# Maximum concurrent exec terminal sessions (at least 1).
exec_max_sessions: {{.ExecMaxSessions}}
# Close an idle exec terminal after this long; 0s disables the timeout.
exec_idle_timeout: {{.ExecIdleTimeout}}

# Docker Engine API socket (must be an absolute path).
{{.DockerSocketLine}}

# How long a cancelled or shutdown-interrupted operation gets after SIGTERM
# before it is killed.
{{.ShutdownGraceLine}}

# Once a day the server fetches the latest release's SHA256SUMS from
# https://github.com/rcss-labs/stackstead to show "update available" in Settings.
# Set to false on air-gapped hosts. Nothing is ever installed automatically.
{{.UpdateCheckLine}}

# Largest single file in an uploaded image context (bytes)
image_max_file_bytes: {{.ImageMaxFileBytes}}

# Largest uploaded image context in total (bytes)
image_max_context_bytes: {{.ImageMaxContextBytes}}
